<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TypeSpec × openapi_first × Rails | Swagger UI</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/swagger-ui/swagger-ui.css">
    <script src="/swagger-ui/swagger-ui-bundle.js" defer></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        SwaggerUIBundle({
          url: "/openapi.yaml",
          dom_id: "#swagger-ui",
          validatorUrl: null,
          deepLinking: true
        });
      });
    </script>
  </head>
  <body>
    <header class="swagger-ui wrapper">
      <h1>TypeSpec × openapi_first × Rails</h1>
      <p>TypeSpecで仕様を定義し、OpenAPIを生成します。openapi_firstが入力を検証し、RSpecでレスポンスの契約を検証します。</p>
      <p>POSTで作成 → GETで確認 → PATCHで変更。各APIのExecuteで実行できます。</p>
    </header>
    <main id="swagger-ui"></main>
    <noscript><p>API仕様の閲覧と実行にはJavaScriptを有効にしてください。</p></noscript>
  </body>
</html>
